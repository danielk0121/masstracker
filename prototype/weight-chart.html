<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>체중 트래커 (Chart.js)</title>
<!-- Chart.js 및 플러그인 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/date-fns@3.3.1/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

<style>
  :root {
    --bg:        #0d0d0f;
    --surface:   #16161a;
    --surface2:  #1e1e24;
    --border:    #2a2a35;
    --accent:    #00e5a0;
    --accent2:   #00b87a;
    --danger:    #ff4d6d;
    --text:      #e8e8f0;
    --text2:     #8888aa;
    --text3:     #55556a;
    --chart-h:   200px;
    --radius:    12px;
  }
  body.light {
    --bg:        #f5f5f7;
    --surface:   #ffffff;
    --surface2:  #ebebf0;
    --border:    #d1d1d8;
    --text:      #1a1a2e;
    --text2:     #555570;
    --text3:     #9999b0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; overflow-x: hidden; }

  .app { display: block; max-width: 480px; margin: 0 auto; }
  header { padding: 16px 20px 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg); z-index: 10; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header-right { display: flex; gap: 8px; align-items: center; }

  .tab-bar { display: flex; gap: 4px; padding: 8px 16px 0; background: var(--bg); }
  .tab { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #000; }

  .summary { padding: 12px 16px 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .stat-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .stat-value.up   { color: var(--danger); }
  .stat-value.down { color: var(--accent); }
  .stat-value.avg  { color: var(--text); }
  .stat-unit { font-size: 11px; color: var(--text2); margin-left: 2px; font-weight: 400; }
  .stat-date { display: block; font-size: 10px; color: var(--text2); font-weight: 400; margin-top: 2px; }

  .chart-wrap { padding: 12px 16px 0; position: relative; }
  .chart-container { width: 100%; height: var(--chart-h); border-radius: var(--radius); overflow: hidden; background: var(--surface); border: 1px solid var(--border); position: relative; }
  #chartCanvas { width: 100% !important; height: 100% !important; }

  .chart-toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 6px; padding: 8px 0 4px; }
  .toolbar-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 11px; padding: 5px 10px; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 4px; }
  .toolbar-btn:hover, .toolbar-btn.active { background: var(--border); color: var(--text); }
  .toolbar-btn svg { width: 13px; height: 13px; }

  .list-section { padding: 0 16px 20px; }
  .list-header { font-size: 12px; color: var(--text3); padding: 14px 0 8px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .list-item { display: flex; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }
  .list-date { flex: 1; font-size: 13px; color: var(--text2); }
  .list-weight { font-size: 17px; font-weight: 700; margin-right: 8px; }
  .list-diff { font-size: 12px; padding: 2px 7px; border-radius: 5px; font-weight: 600; }
  .diff-up   { color: var(--danger); background: rgba(255,77,109,.1); }
  .diff-down { color: var(--accent); background: rgba(0,229,160,.1); }
  .diff-same { color: var(--text3); background: var(--surface2); }

  #btn-theme { background: none; border: none; cursor: pointer; font-size: 18px; line-height: 1; padding: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>체중 트래커 (Chart.js)</h1>
    <div class="header-right">
      <span style="font-size:11px;color:var(--text3);">수정 2026-03-11</span>
      <button id="btn-theme" onclick="toggleTheme()" title="테마 전환">🌙</button>
      <span id="today-badge" style="font-size:12px;color:var(--text2);"></span>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab active" data-mode="recent40">최근40일</button>
    <button class="tab" data-mode="thisyear">올해</button>
    <button class="tab" data-mode="all">전체보기</button>
    <button class="tab" data-mode="weekly">주간평균</button>
    <button class="tab" data-mode="monthly">월간평균</button>
  </div>

  <div class="summary">
    <div class="stat">
      <div class="stat-label">평균</div>
      <div class="stat-value avg" id="s-avg">–</div>
    </div>
    <div class="stat">
      <div class="stat-label">최저</div>
      <div class="stat-value down" id="s-min">–</div>
    </div>
    <div class="stat">
      <div class="stat-label">최고</div>
      <div class="stat-value up" id="s-max">–</div>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="chart-toolbar">
      <button class="toolbar-btn" id="btn-label" onclick="toggleLabels()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><line x1="8" y1="1" x2="8" y2="4"/><line x1="8" y1="12" x2="8" y2="15"/><line x1="1" y1="8" x2="4" y2="8"/><line x1="12" y1="8" x2="15" y2="8"/></svg>
        꼭지점
      </button>
      <button class="toolbar-btn" onclick="resetZoom()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
        초기화
      </button>
    </div>
    <div class="chart-container">
      <canvas id="chartCanvas"></canvas>
    </div>
  </div>

  <div class="list-section">
    <div class="list-header" id="list-title">최근 기록</div>
    <div id="data-list"></div>
  </div>
</div>

  {date:'2024-12-26',w:76.7},{date:'2024-12-28',w:77.2},{date:'2024-12-30',w:77.7},
  {date:'2026-03-01',w:73.9},{date:'2026-03-11',w:74.0}
];

let allData = [...RAW_DATA].sort((a,b) => a.date.localeCompare(b.date));
let mode = 'recent40';
let showLabels = false;
let isLight = false;
let chart;

const DAYS = ['일','월','화','수','목','금','토'];
const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
const fmtFull = d => {
  const dt = new Date(d);
  return `${dt.getFullYear()}.${dt.getMonth()+1}.${dt.getDate()} (${DAYS[dt.getDay()]})`;
};

function initChart() {
  Chart.register(ChartDataLabels);
  const ctx = document.getElementById('chartCanvas').getContext('2d');
  
  chart = new Chart(ctx, {
    type: 'line',
    data: { datasets: [{
      label: '체중',
      borderColor: '#00e5a0',
      borderWidth: 2,
      pointRadius: 0,
      pointHoverRadius: 6,
      pointBackgroundColor: '#00e5a0',
      tension: 0.3,
      data: []
    }]},
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 25, bottom: 5, left: 5, right: 15 } },
      scales: {
        x: {
          type: 'time',
          time: { unit: 'day', displayFormats: { day: 'MM/dd' } },
          grid: { color: 'rgba(42,42,53,0.3)', drawBorder: false },
          ticks: { color: '#8888aa', font: { size: 10 } }
        },
        y: {
          position: 'right',
          grid: { color: 'rgba(42,42,53,0.3)', drawBorder: false },
          ticks: { color: '#8888aa', font: { size: 10 } }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: true,
          mode: 'index',
          intersect: false,
          backgroundColor: '#1e1e24',
          titleColor: '#8888aa',
          bodyColor: '#e8e8f0',
          borderColor: '#2a2a35',
          borderWidth: 1
        },
        zoom: {
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            mode: 'x',
          },
          pan: { enabled: true, mode: 'x' }
        },
        datalabels: {
          display: () => showLabels,
          align: 'top',
          color: '#00e5a0',
          font: { weight: 'bold', size: 10 },
          formatter: (v) => v.y.toFixed(1)
        }
      },
      interaction: { mode: 'nearest', axis: 'x', intersect: false }
    }
  });
}

function getChartData() {
  if (mode === 'recent40') {
    return allData.slice(-40).map(d => ({ x: new Date(d.date), y: d.w }));
  }
  if (mode === 'thisyear') {
    const year = new Date().getFullYear().toString();
    return allData.filter(d => d.date.startsWith(year)).map(d => ({ x: new Date(d.date), y: d.w }));
  }
  if (mode === 'all') {
    return allData.map(d => ({ x: new Date(d.date), y: d.w }));
  }
  if (mode === 'weekly') {
    const map = {};
    allData.forEach(d => {
      const dt = new Date(d.date);
      const day = dt.getDay();
      const diff = (day === 0) ? -6 : 1 - day;
      const mon = new Date(dt); mon.setDate(dt.getDate() + diff);
      const key = mon.toISOString().slice(0,10);
      if (!map[key]) map[key] = [];
      map[key].push(d.w);
    });
    return Object.entries(map).sort().map(([k,arr]) => ({ x: new Date(k), y: +avg(arr).toFixed(2) }));
  }
  if (mode === 'monthly') {
    const map = {};
    allData.forEach(d => {
      const key = d.date.slice(0,7)+'-01';
      if (!map[key]) map[key] = [];
      map[key].push(d.w);
    });
    return Object.entries(map).sort().map(([k,arr]) => ({ x: new Date(k), y: +avg(arr).toFixed(2) }));
  }
  return [];
}

function updateChart() {
  const pts = getChartData();
  chart.data.datasets[0].data = pts;
  
  // 요약
  const vals = pts.map(p => p.y);
  const minVal = Math.min(...vals);
  const maxVal = Math.max(...vals);
  const minItem = pts.find(p => p.y === minVal);
  const maxItem = pts.find(p => p.y === maxVal);
  
  const fmtD = d => { const dt = new Date(d); return `${dt.getFullYear()}.${dt.getMonth()+1}.${dt.getDate()}`; };
  
  document.getElementById('s-avg').innerHTML = avg(vals).toFixed(1)+'<span class="stat-unit">kg</span>';
  document.getElementById('s-min').innerHTML = minVal.toFixed(1)+'<span class="stat-unit">kg</span><span class="stat-date">'+fmtD(minItem.x)+'</span>';
  document.getElementById('s-max').innerHTML = maxVal.toFixed(1)+'<span class="stat-unit">kg</span><span class="stat-date">'+fmtD(maxItem.x)+'</span>';

  chart.update();
  renderList(pts);
}

function renderList(pts) {
  const rev = [...pts].reverse();
  const titles = { recent40:'최근 40일', thisyear:`${new Date().getFullYear()}년 기록`, all:'전체 기록', weekly:'주간 평균', monthly:'월간 평균' };
  document.getElementById('list-title').textContent = titles[mode];

  const el = document.getElementById('data-list');
  el.innerHTML = rev.map((p, i) => {
    const prev = rev[i+1];
    let diffHtml = '<span class="list-diff diff-same">–</span>';
    if (prev) {
      const d = (p.y - prev.y).toFixed(1);
      if (d > 0) diffHtml = `<span class="list-diff diff-up">▲${d}</span>`;
      else if (d < 0) diffHtml = `<span class="list-diff diff-down">▼${Math.abs(d)}</span>`;
      else diffHtml = '<span class="list-diff diff-same">→0.0</span>';
    }
    return `<div class="list-item">
      <span class="list-date">${fmtFull(p.x)}</span>
      <span class="list-weight">${p.y.toFixed(1)}<small style="font-size:11px;color:var(--text2);margin-left:2px">kg</small></span>
      ${diffHtml}
    </div>`;
  }).join('');
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    updateChart();
  });
});

function toggleLabels() {
  showLabels = !showLabels;
  document.getElementById('btn-label').classList.toggle('active', showLabels);
  chart.update();
}

function resetZoom() {
  chart.resetZoom();
}

function toggleTheme() {
  isLight = !isLight;
  document.body.classList.toggle('light', isLight);
  document.getElementById('btn-theme').textContent = isLight ? '☀️' : '🌙';
  const color = isLight ? '#555570' : '#8888aa';
  const gridColor = isLight ? 'rgba(209,209,216,0.5)' : 'rgba(42,42,53,0.3)';
  
  chart.options.scales.x.ticks.color = color;
  chart.options.scales.y.ticks.color = color;
  chart.options.scales.x.grid.color = gridColor;
  chart.options.scales.y.grid.color = gridColor;
  chart.update();
}

initChart();
updateChart();
document.getElementById('today-badge').textContent = `${new Date().getMonth()+1}월 ${new Date().getDate()}일 (${DAYS[new Date().getDay()]})`;
</script>
</body>
</html>
