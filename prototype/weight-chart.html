<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>체중 트래커</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
  /* ── 전역 변수 & 리셋 ── */
  :root {
    --bg:        #0d0d0f;
    --surface:   #16161a;
    --surface2:  #1e1e24;
    --border:    #2a2a35;
    --accent:    #00e5a0;
    --accent2:   #00b87a;
    --danger:    #ff4d6d;
    --text:      #e8e8f0;
    --text2:     #8888aa;
    --text3:     #55556a;
    --chart-h:   240px;
    --radius:    12px;
  }
  body.light {
    --bg:        #f5f5f7;
    --surface:   #ffffff;
    --surface2:  #ebebf0;
    --border:    #d1d1d8;
    --text:      #1a1a2e;
    --text2:     #555570;
    --text3:     #9999b0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; overflow-x: hidden; }

  /* ── 레이아웃 ── */
  .app { display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }
  header { padding: 16px 10px 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header-right { display: flex; gap: 8px; align-items: center; }

  /* ── 탭 (7일/주간/월간/전체) ── */
  .tab-bar { display: flex; gap: 4px; padding: 12px 8px 0; background: var(--bg); }
  .tab { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #000; }

  /* ── 요약 카드 ── */
  .summary { padding: 14px 8px 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .stat-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .stat-value.up   { color: var(--danger); }
  .stat-value.down { color: var(--accent); }
  .stat-value.avg  { color: var(--text); }
  .stat-unit { font-size: 11px; color: var(--text2); margin-left: 2px; font-weight: 400; }
  .stat-date { display: block; font-size: 10px; color: var(--text2); font-weight: 400; margin-top: 2px; }

  /* ── 목표 체중 패널 ── */
  .goal-panel { padding: 12px 8px 4px; display: flex; align-items: center; gap: 10px; }
  .goal-label { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .goal-input-wrap { flex: 1; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
  .goal-input { width: 100%; background: none; border: none; color: var(--text); font-size: 15px; font-weight: 700; outline: none; padding: 4px 0; }
  .goal-input:disabled { color: var(--text2); cursor: not-allowed; }
  .goal-unit { font-size: 12px; color: var(--text3); font-weight: 600; }
  .goal-btn-group { display: flex; gap: 4px; }
  .goal-btn { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap; }
  .goal-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
  .goal-btn:hover:not(:disabled) { background: var(--border); color: var(--text); }
  .goal-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── 차트 영역 ── */
  .chart-wrap { padding: 12px 8px 0; position: relative; }
  .chart-container { width: 100%; height: var(--chart-h); border-radius: var(--radius); overflow: hidden; background: var(--surface); border: 1px solid var(--border); position: relative; touch-action: none; cursor: grab; }
  .chart-container:active { cursor: grabbing; }
  .chart-container canvas { width: 100% !important; height: 100% !important; cursor: inherit; }

  /* ── 차트 툴바 ── */
  .chart-toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 6px; padding: 8px 0 4px; }
  .toolbar-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 11px; padding: 5px 10px; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 4px; }
  .toolbar-btn:hover, .toolbar-btn.active { background: var(--border); color: var(--text); }
  .toolbar-btn svg { width: 13px; height: 13px; }

  /* ── 데이터 리스트 ── */
  .list-section { padding: 0 8px 20px; }
  .list-header { font-size: 12px; color: var(--text3); padding: 14px 0 8px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .list-item { display: flex; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }
  .list-date { flex: 1; font-size: 13px; color: var(--text2); }
  .list-weight { font-size: 17px; font-weight: 700; margin-right: 8px; }
  .list-diff { font-size: 12px; padding: 2px 7px; border-radius: 5px; font-weight: 600; }
  .diff-up   { color: var(--danger); background: rgba(255,77,109,.1); }
  .diff-down { color: var(--accent); background: rgba(0,229,160,.1); }
  .diff-same { color: var(--text3); background: var(--surface2); }

  /* ── 테마 토글 버튼 ── */
  #btn-theme { background: none; border: none; cursor: pointer; font-size: 18px; line-height: 1; padding: 2px; }

  /* ── 스크롤바 ── */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">

  <!-- 헤더 -->
  <header>
    <h1>체중 트래커</h1>
    <div class="header-right">
      <span style="font-size:11px;color:var(--text3);">수정 2026-03-12 00:33:05 KST</span>
      <button id="btn-theme" onclick="toggleTheme()" title="테마 전환">🌙</button>
      <span id="today-badge" style="font-size:12px;color:var(--text2);"></span>
    </div>
  </header>

  <!-- 탭 -->
  <div class="tab-bar">
    <button class="tab active" data-mode="recent40">최근40일</button>
    <button class="tab" data-mode="thisyear">올해</button>
    <button class="tab" data-mode="all">전체보기</button>
    <button class="tab" data-mode="weekly">주간평균</button>
    <button class="tab" data-mode="monthly">월간평균</button>
  </div>

  <!-- 요약 -->
  <div class="summary">
    <div class="stat">
      <div class="stat-label">평균</div>
      <div class="stat-value avg" id="s-avg">–</div>
    </div>
    <div class="stat">
      <div class="stat-label">최저</div>
      <div class="stat-value down" id="s-min">–</div>
    </div>
    <div class="stat">
      <div class="stat-label">최고</div>
      <div class="stat-value up" id="s-max">–</div>
    </div>
  </div>

  <!-- 목표 체중 설정 -->
  <div class="goal-panel">
    <div class="goal-label">목표 체중</div>
    <div class="goal-input-wrap">
      <input type="number" id="goal-input" class="goal-input" step="0.1" placeholder="예: 70.5" disabled>
      <span class="goal-unit">kg</span>
    </div>
    <div class="goal-btn-group">
      <button id="goal-btn-edit" class="goal-btn" onclick="editGoal()">수정</button>
      <button id="goal-btn-apply" class="goal-btn primary" onclick="applyGoal()" style="display:none;">적용</button>
    </div>
  </div>

  <!-- 차트 -->
  <div class="chart-wrap">
    <div class="chart-toolbar">
      <button class="toolbar-btn" id="btn-dot" onclick="toggleDots()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3.5"/><circle cx="2" cy="8" r="2"/><circle cx="14" cy="8" r="2"/></svg>
        점
      </button>
      <button class="toolbar-btn" id="btn-label" onclick="toggleLabels()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><line x1="8" y1="1" x2="8" y2="4"/><line x1="8" y1="12" x2="8" y2="15"/><line x1="1" y1="8" x2="4" y2="8"/><line x1="12" y1="8" x2="15" y2="8"/></svg>
        꼭지점
      </button>
      <button class="toolbar-btn" onclick="zoomIn()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/><line x1="4.5" y1="6.5" x2="8.5" y2="6.5"/><line x1="6.5" y1="4.5" x2="6.5" y2="8.5"/></svg>
        확대
      </button>
      <button class="toolbar-btn" onclick="zoomOut()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/><line x1="4.5" y1="6.5" x2="8.5" y2="6.5"/></svg>
        축소
      </button>
      <button class="toolbar-btn" onclick="resetZoom()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
        초기화
      </button>
    </div>
    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <!-- 데이터 목록 -->
  <div class="list-section">
    <div class="list-header" id="list-title">최근 기록</div>
    <div id="data-list"></div>
  </div>

</div>

const fmtDate = d => { const [y,m,dd] = d.split('-'); return `${m}/${dd}`; };
const DAYS = ['일','월','화','수','목','금','토'];
const fmtFull = d => {
  const [y,m,dd] = d.split('-');
  const dow = DAYS[new Date(`${y}-${m}-${dd}T00:00:00`).getDay()];
  return `${y}.${m}.${dd} (${dow})`;
};
const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;

/* ────────────────────────────────────
   목표 체중 로직
──────────────────────────────────── */
function initGoalWeight() {
  // 로컬 스토리지 확인 (추후 영속성 위해)
  const saved = localStorage.getItem('goalWeight');
  if (saved) {
    goalWeight = parseFloat(saved);
  } else {
    // 올해 평균값 계산
    const thisYear = new Date().getFullYear().toString();
    const thisYearData = allData.filter(d => d.date.startsWith(thisYear));
    if (thisYearData.length > 0) {
      goalWeight = parseFloat(avg(thisYearData.map(d => d.w)).toFixed(1));
    } else {
      goalWeight = 70.0; // 데이터 없을 시 기본값
    }
  }
  document.getElementById('goal-input').value = goalWeight;
}

function editGoal() {
  const input = document.getElementById('goal-input');
  const btnEdit = document.getElementById('goal-btn-edit');
  const btnApply = document.getElementById('goal-btn-apply');

  input.disabled = false;
  input.focus();
  btnEdit.style.display = 'none';
  btnApply.style.display = 'block';
}

function applyGoal() {
  const input = document.getElementById('goal-input');
  const btnEdit = document.getElementById('goal-btn-edit');
  const btnApply = document.getElementById('goal-btn-apply');

  const val = parseFloat(input.value);
  if (isNaN(val) || val <= 0) {
    alert('유효한 체중을 입력해주세요.');
    return;
  }

  goalWeight = val;
  localStorage.setItem('goalWeight', goalWeight); // 저장
  
  input.disabled = true;
  btnEdit.style.display = 'block';
  btnApply.style.display = 'none';
  
  updateGoalLine();
}

function updateGoalLine() {
  if (!chart) return;
  
  // 목표선 데이터셋 업데이트
  const dataset = chart.data.datasets[1];
  if (dataset) {
    // 현재 차트 데이터의 X축 범위에 맞춰 가로선 생성
    const chartData = chart.data.datasets[0].data;
    if (chartData.length > 0) {
      const firstX = chartData[0].x;
      const lastX = chartData[chartData.length - 1].x;
      dataset.data = [
        { x: firstX, y: goalWeight },
        { x: lastX, y: goalWeight }
      ];
      chart.update('none');
    }
  }
}

/* ────────────────────────────────────
   최소/최대 커스텀 플러그인
──────────────────────────────────── */
const minMaxLabelPlugin = {
  id: 'minMaxLabel',
  afterDatasetsDraw(chart) {
    const dataset = chart.data.datasets[0];
    if (!dataset || !dataset.data.length) return;
    const meta = chart.getDatasetMeta(0);
    const ctx = chart.ctx;
    const data = dataset.data;
    const chartArea = chart.chartArea;

    /* 현재 보이는 범위의 데이터만 필터링 */
    const xScale = chart.scales.x;
    const visibleMin = xScale.min;
    const visibleMax = xScale.max;
    const visibleIndices = [];
    data.forEach((d, i) => {
      const t = new Date(d.x).getTime();
      if (t >= visibleMin && t <= visibleMax) visibleIndices.push(i);
    });
    if (visibleIndices.length === 0) return;

    if (showLabels) {
      // 보이는 범위의 모든 포인트에 라벨 표시
      visibleIndices.forEach(i => {
        const pt = meta.data[i];
        if (!pt) return;
        const x = pt.x, y = pt.y;
        if (x < chartArea.left || x > chartArea.right) return;
        ctx.save();
        ctx.font = 'bold 9px sans-serif';
        ctx.fillStyle = 'rgba(0,229,160,0.85)';
        ctx.textAlign = 'center';
        ctx.fillText(data[i].y.toFixed(1), x, y - 8);
        ctx.restore();
      });
    } else {
      // 보이는 범위에서 최소/최대만 표시
      let minIdx = visibleIndices[0], maxIdx = visibleIndices[0];
      visibleIndices.forEach(i => {
        if (data[i].y < data[minIdx].y) minIdx = i;
        if (data[i].y > data[maxIdx].y) maxIdx = i;
      });

      [{ idx: minIdx, color: '#00e5a0', dir: 1 }, { idx: maxIdx, color: '#ff4d6d', dir: -1 }].forEach(({ idx, color, dir }) => {
        const pt = meta.data[idx];
        if (!pt) return;
        const x = pt.x, y = pt.y;
        if (x < chartArea.left || x > chartArea.right) return;
        const label = data[idx].y.toFixed(1);

        ctx.save();
        // 삼각형 마커
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y + dir * 6);
        ctx.lineTo(x - 4, y + dir * 12);
        ctx.lineTo(x + 4, y + dir * 12);
        ctx.closePath();
        ctx.fill();

        // 라벨
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = color;
        ctx.fillText(label, x, y + dir * 24);
        ctx.restore();
      });
    }
  }
};

/* ────────────────────────────────────
   전체 차트 데이터 빌드 (항상 전 기간 로드)
──────────────────────────────────── */
function buildAllChartData() {
  if (mode === 'weekly') {
    const map = {};
    allData.forEach(d => {
      const dt = new Date(d.date);
      const day = dt.getDay();
      const diff = (day === 0) ? -6 : 1 - day;
      const mon = new Date(dt); mon.setDate(dt.getDate() + diff);
      const key = mon.toISOString().slice(0,10);
      if (!map[key]) map[key] = [];
      map[key].push(d.w);
    });
    return Object.entries(map).sort().map(([k,arr]) => ({ x: k, y: +avg(arr).toFixed(2) }));
  }
  if (mode === 'monthly') {
    const map = {};
    allData.forEach(d => {
      const key = d.date.slice(0,7)+'-01';
      if (!map[key]) map[key] = [];
      map[key].push(d.w);
    });
    return Object.entries(map).sort().map(([k,arr]) => ({ x: k, y: +avg(arr).toFixed(2) }));
  }
  /* recent40 / thisyear / all — 전체 일별 데이터 로드 (패닝으로 탐색) */
  return allData.map(d => ({ x: d.date, y: d.w }));
}

/* ────────────────────────────────────
   탭별 초기 표시 윈도우 계산
──────────────────────────────────── */
function getInitialWindow(allPts) {
  if (!allPts.length) return {};
  const lastTs  = new Date(allPts[allPts.length - 1].x).getTime();
  const firstTs = new Date(allPts[0].x).getTime();
  const nowTs   = new Date().getTime();

  if (mode === 'recent40') {
    /* 마지막 40개 데이터 포인트의 날짜 범위 */
    const recent = allPts.slice(-40);
    return { min: new Date(recent[0].x).getTime() - 86400000, max: lastTs + 86400000 };
  }
  if (mode === 'thisyear') {
    const yearStart = new Date(new Date().getFullYear(), 0, 1).getTime();
    return { min: yearStart, max: lastTs + 86400000 };
  }
  if (mode === 'weekly') {
    /* 현재로부터 365일 (1년) */
    return { min: nowTs - 365 * 86400000, max: nowTs + 7 * 86400000 };
  }
  if (mode === 'monthly') {
    /* 현재로부터 365일 (1년) */
    return { min: nowTs - 365 * 86400000, max: nowTs + 30 * 86400000 };
  }
  /* 'all': 전체 표시 */
  return { min: firstTs, max: lastTs + 86400000 };
}

/* ────────────────────────────────────
   현재 보이는 X 범위로 통계·목록 동기화
──────────────────────────────────── */
function syncListToRange(minMs, maxMs) {
  const pts = chart.data.datasets[0].data;
  const pad = 2 * 86400000;
  const visible = pts.filter(p => {
    const t = new Date(p.x).getTime();
    return t >= minMs - pad && t <= maxMs + pad;
  });
  if (visible.length > 0) {
    autoScaleY(visible);
    updateStats(visible);
    renderList(visible);
  }
}

/* ────────────────────────────────────
   Y축 자동 스케일 (보이는 데이터 기준)
──────────────────────────────────── */
function autoScaleY(visible) {
  if (!visible.length) return;
  const vals = visible.map(p => p.y);
  const minV = Math.min(...vals);
  const maxV = Math.max(...vals);
  const range = maxV - minV || 1;
  const pad = Math.max(range * 0.25, 0.5);
  chart.options.scales.y.min = Math.floor((minV - pad) * 2) / 2;
  chart.options.scales.y.max = Math.ceil((maxV + pad) * 2) / 2;
  chart.update('none');
}

/* ────────────────────────────────────
   줌 인 / 줌 아웃 버튼
──────────────────────────────────── */
function zoomIn()  { chart.zoom(1.4); }
function zoomOut() { chart.zoom(1 / 1.4); }

/* ────────────────────────────────────
   통계 카드 업데이트
──────────────────────────────────── */
function updateStats(pts) {
  const vals  = pts.map(p => p.y);
  const minVal = Math.min(...vals);
  const maxVal = Math.max(...vals);
  const minPt  = pts.filter(p => p.y === minVal).slice(-1)[0];
  const maxPt  = pts.filter(p => p.y === maxVal).slice(-1)[0];
  const fmtStat = d => {
    const [y,m,dd] = d.split('-');
    const dow = DAYS[new Date(`${y}-${m}-${dd}T00:00:00`).getDay()];
    return `${y}.${m}.${dd} (${dow})`;
  };
  document.getElementById('s-avg').innerHTML = avg(vals).toFixed(1)+'<span class="stat-unit">kg</span>';
  document.getElementById('s-min').innerHTML = minVal.toFixed(1)+'<span class="stat-unit">kg</span><span class="stat-date">'+fmtStat(minPt.x)+'</span>';
  document.getElementById('s-max').innerHTML = maxVal.toFixed(1)+'<span class="stat-unit">kg</span><span class="stat-date">'+fmtStat(maxPt.x)+'</span>';
}

/* ────────────────────────────────────
   차트 업데이트
──────────────────────────────────── */
function updateChart() {
  const allPts = buildAllChartData();
  if (!allPts.length) return;

  /* 전체 데이터 로드 (패닝으로 전 기간 탐색 가능) */
  chart.data.datasets[0].data = allPts;

  /* 시간 축 단위 */
  const timeOpts = chart.options.scales.x.time;
  if (mode === 'monthly') {
    timeOpts.unit = 'month';
  } else if (mode === 'all' || mode === 'weekly') {
    timeOpts.unit = 'month';
  } else {
    timeOpts.unit = 'day';
  }

  /* 패닝 한계: 전체 데이터 범위 */
  const firstTs = new Date(allPts[0].x).getTime();
  const lastTs  = new Date(allPts[allPts.length - 1].x).getTime();
  chart.options.plugins.zoom.limits.x.min = firstTs - 7 * 86400000;
  chart.options.plugins.zoom.limits.x.max = lastTs  + 7 * 86400000;

  /* 스케일 초기화 후 초기 윈도우 적용 */
  delete chart.options.scales.x.min;
  delete chart.options.scales.x.max;
  delete chart.options.scales.y.min;
  delete chart.options.scales.y.max;
  chart.update('none');

  const win = getInitialWindow(allPts);
  chart.zoomScale('x', { min: win.min, max: win.max }, 'none');

  /* 초기 윈도우 범위 데이터로 통계·목록 업데이트 */
  const pad = 2 * 86400000;
  const initVisible = allPts.filter(p => {
    const t = new Date(p.x).getTime();
    return t >= win.min - pad && t <= win.max + pad;
  });
  const pts = initVisible.length ? initVisible : allPts;
  autoScaleY(pts);
  updateStats(pts);
  updateGoalLine();
  renderList(pts);
}

/* ────────────────────────────────────
   리스트 렌더링
──────────────────────────────────── */
function renderList(pts) {
  const rev = [...pts].reverse();
  const titles = { recent40:'최근 40일', thisyear:`${new Date().getFullYear()}년 기록`, all:'전체 기록', weekly:'주간 평균 <span style="font-weight:400;color:var(--text3)">(월요일 기준)</span>', monthly:'월간 평균' };
  document.getElementById('list-title').innerHTML = titles[mode];

  const el = document.getElementById('data-list');
  el.innerHTML = rev.map((p, i) => {
    const prev = rev[i+1];
    let diffHtml = '<span class="list-diff diff-same">–</span>';
    if (prev) {
      const d = (p.y - prev.y).toFixed(1);
      if (d > 0) diffHtml = `<span class="list-diff diff-up">▲${d}</span>`;
      else if (d < 0) diffHtml = `<span class="list-diff diff-down">▼${Math.abs(d)}</span>`;
      else diffHtml = '<span class="list-diff diff-same">→0.0</span>';
    }
    const dateLabel = mode === 'monthly'
      ? p.x.slice(0,7).replace('-','년 ')+'월'
      : mode === 'weekly'
        ? `${fmtFull(p.x).replace(/ \(월\)/, '')} 주`
        : fmtFull(p.x);
    return `<div class="list-item">
      <span class="list-date">${dateLabel}</span>
      <span class="list-weight">${p.y.toFixed(1)}<small style="font-size:11px;color:var(--text2);margin-left:2px">kg</small></span>
      ${diffHtml}
    </div>`;
  }).join('');
}

/* ────────────────────────────────────
   탭 전환
──────────────────────────────────── */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    updateChart();
  });
});

/* ────────────────────────────────────
   점 표시 토글
──────────────────────────────────── */
function toggleDots() {
  showDots = !showDots;
  document.getElementById('btn-dot').classList.toggle('active', showDots);
  const t = getTheme();
  const ds = chart.data.datasets[0];
  ds.pointRadius = showDots ? 2 : 0;
  ds.pointBackgroundColor = t.line;
  ds.pointBorderColor = t.line;
  ds.pointBorderWidth = 0;
  chart.update();
}

/* ────────────────────────────────────
   꼭지점 토글
──────────────────────────────────── */
function toggleLabels() {
  showLabels = !showLabels;
  document.getElementById('btn-label').classList.toggle('active', showLabels);
  chart.update();
}

/* ────────────────────────────────────
   줌 초기화 (현재 탭의 기본 윈도우로 복귀)
──────────────────────────────────── */
function resetZoom() {
  const allPts = chart.data.datasets[0].data;
  if (!allPts.length) return;

  delete chart.options.scales.x.min;
  delete chart.options.scales.x.max;
  delete chart.options.scales.y.min;
  delete chart.options.scales.y.max;
  chart.update('none');

  const win = getInitialWindow(allPts);
  chart.zoomScale('x', { min: win.min, max: win.max }, 'none');

  const pad = 2 * 86400000;
  const visible = allPts.filter(p => {
    const t = new Date(p.x).getTime();
    return t >= win.min - pad && t <= win.max + pad;
  });
  const pts = visible.length ? visible : allPts;
  autoScaleY(pts);
  updateStats(pts);
  renderList(pts);
}

/* ────────────────────────────────────
   날짜 뱃지
──────────────────────────────────── */
function updateBadge() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('today-badge').textContent =
    `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

/* ────────────────────────────────────
   다크/라이트 테마 토글
──────────────────────────────────── */
function toggleTheme() {
  isLight = !isLight;
  document.body.classList.toggle('light', isLight);
  document.getElementById('btn-theme').textContent = isLight ? '☀️' : '🌙';
  const t = getTheme();
  chart.options.scales.x.grid.color = t.grid;
  chart.options.scales.x.ticks.color = t.text;
  chart.options.scales.x.border.color = t.border;
  chart.options.scales.y.grid.color = t.grid;
  chart.options.scales.y.ticks.color = t.text;
  chart.options.scales.y.border.color = t.border;
  chart.data.datasets[0].borderColor = t.line;
  chart.data.datasets[0].pointBackgroundColor = t.line;
  chart.data.datasets[0].pointBorderColor = t.line;
  chart.data.datasets[0].pointHoverBackgroundColor = t.line;
  chart.data.datasets[0].pointHoverBorderColor = t.line;
  chart.data.datasets[0].backgroundColor = isLight ? 'rgba(26,26,46,0.05)' : 'rgba(0,229,160,0.08)';
  chart.options.plugins.tooltip.backgroundColor = isLight ? 'rgba(255,255,255,0.95)' : 'rgba(13,13,15,0.9)';
  chart.options.plugins.tooltip.titleColor = isLight ? '#555570' : '#8888aa';
  chart.options.plugins.tooltip.bodyColor = isLight ? '#1a1a2e' : '#e8e8f0';
  chart.options.plugins.tooltip.borderColor = isLight ? 'rgba(209,209,216,0.8)' : 'rgba(42,42,53,0.8)';
  chart.update();
}

/* ────────────────────────────────────
   초기화
──────────────────────────────────── */
initGoalWeight();
initChart();
updateChart();
updateBadge();
</script>
</body>
</html>
